<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>prod-imagen studio</title>
  <style>
    :root {
      --bg: #0b0a0e; --surface: #121016; --surface-2: #17151c;
      --hairline: rgba(255,255,255,0.07); --hairline-strong: rgba(255,255,255,0.14);
      --ink: #e9e7ee; --ink-2: rgba(233,231,238,0.60); --ink-3: rgba(233,231,238,0.38);
      --accent: #5a4ca8;
    }
    * { box-sizing: border-box; margin: 0; user-select: none; }
    body {
      background: var(--bg); color: var(--ink); height: 100vh;
      font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .drag-strip { position: fixed; top: 0; left: 0; right: 92px; height: 40px; -webkit-app-region: drag; }
    #win-close, #win-min {
      position: fixed; top: 6px; width: 38px; height: 30px;
      background: transparent; border: none; color: var(--ink-3); border-radius: 6px; cursor: pointer;
    }
    #win-close { right: 8px; }
    #win-min { right: 50px; }
    #win-min:hover { background: var(--surface-2); color: var(--ink); }
    #win-close:hover { background: #b3352c; color: #fff; }
    input, textarea { user-select: text !important; -webkit-user-select: text !important; }
    .wordmark { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .wordmark svg { width: 24px; height: 24px; color: var(--ink); }
    .wordmark b { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
    .sub { color: var(--ink-3); font-size: 12px; margin-bottom: 34px; }
    .sub a { color: var(--accent); text-decoration: none; }
    .tiles { display: grid; grid-template-columns: 220px 220px; gap: 12px; }
    .tile {
      background: var(--surface); border: 1px solid var(--hairline); border-radius: 9px;
      padding: 14px 16px; cursor: pointer; transition: border-color 120ms;
    }
    .tile:hover { border-color: var(--hairline-strong); }
    .tile.sel { border-color: var(--accent); }
    .tile svg { width: 16px; height: 16px; color: var(--ink-2); margin-bottom: 9px; }
    .tile h2 { font-size: 13px; font-weight: 600; }
    .tile p { color: var(--ink-3); font-size: 11.5px; margin-top: 2px; }
    .tile .tag { float: right; font-size: 9.5px; letter-spacing: 0.06em; color: var(--ink-3); border: 1px solid var(--hairline); border-radius: 4px; padding: 1px 6px; }
    .kinds { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 22px; }
    .kind {
      font-size: 11px; color: var(--ink-2); border: 1px solid var(--hairline);
      border-radius: 99px; padding: 3px 11px; cursor: pointer;
    }
    .kind:hover { color: var(--ink); border-color: var(--hairline-strong); }
    .kind.sel { color: var(--ink); border-color: var(--accent); }
    .row { display: flex; gap: 8px; width: 452px; }
    input[type="text"] {
      flex: 1; background: var(--surface); border: 1px solid var(--hairline); border-radius: 7px;
      color: var(--ink); padding: 8px 12px; font: inherit; user-select: text;
    }
    input[type="text"]:focus { outline: none; border-color: var(--accent); }
    button {
      background: var(--surface-2); color: var(--ink); border: 1px solid var(--hairline);
      border-radius: 7px; padding: 8px 16px; font: inherit; cursor: pointer;
    }
    button:hover { border-color: var(--hairline-strong); }
    button.primary { border-color: var(--accent); }
    footer { position: fixed; bottom: 14px; color: var(--ink-3); font-size: 11px; }
  </style>
</head>
<body>
  <div class="drag-strip"></div>
  <button id="win-min" title="Minimize">–</button>
  <button id="win-close" title="Close">✕</button>

  <div class="wordmark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6" stroke-linejoin="round"/></svg>
    <b>prod-imagen</b>
  </div>
  <div class="sub">studio</div>

  <div class="tiles">
    <div class="tile sel" id="tile-image" data-mode="image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/><path d="M3.5 15l5-5 4 4 2.5-2.5 5.5 5.5"/></svg>
      <h2>Image project</h2>
      <p>Pages, panels, posters, diagrams</p>
    </div>
    <div class="tile" id="tile-video" data-mode="video">
      <span class="tag">PHASE 2</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="5" width="17" height="14" rx="1.5"/><path d="M10 9.5l5 2.5-5 2.5v-5z" stroke-linejoin="round"/></svg>
      <h2>Video project</h2>
      <p>Deterministic frame sequences</p>
    </div>
  </div>

  <div class="kinds" id="kinds">
    <span class="kind sel" data-kind="manga">Manga</span>
    <span class="kind" data-kind="anime">Illustration</span>
    <span class="kind" data-kind="coloring">Coloring book</span>
    <span class="kind" data-kind="poster">Poster</span>
    <span class="kind" data-kind="card">Greeting card</span>
    <span class="kind" data-kind="blueprint">Blueprint</span>
    <span class="kind" data-kind="free">Freeform</span>
  </div>

  <div class="row">
    <input type="text" id="project-name" placeholder="Project name" value="Untitled manga" />
    <button id="create" class="primary">Create</button>
    <button id="open-existing">Open</button>
  </div>

  <footer>prod-imagen studio 0.4</footer>

  <script>
    let mode = "image";
    let kind = "manga";
    document.getElementById("win-close").onclick = () => window.studio.win("close");
    document.getElementById("win-min").onclick = () => window.studio.win("min");

    document.querySelectorAll(".tile").forEach((tile) => {
      tile.addEventListener("click", () => {
        document.querySelectorAll(".tile").forEach((t) => t.classList.remove("sel"));
        tile.classList.add("sel");
        mode = tile.dataset.mode;
      });
    });
    document.querySelectorAll(".kind").forEach((chip) => {
      chip.addEventListener("click", () => {
        document.querySelectorAll(".kind").forEach((c) => c.classList.remove("sel"));
        chip.classList.add("sel");
        kind = chip.dataset.kind;
        const names = {
          manga: "Untitled manga", anime: "Untitled illustration",
          coloring: "Untitled coloring book", poster: "Untitled poster",
          card: "Untitled card", blueprint: "Untitled blueprint",
          free: "Untitled canvas",
        };
        const input = document.getElementById("project-name");
        if (input.value.startsWith("Untitled")) input.value = names[kind];
      });
    });

    document.getElementById("create").addEventListener("click", () => {
      if (mode === "video") return alert("Video projects arrive in phase 2. Start with an Image project.");
      window.studio.openProject({
        name: document.getElementById("project-name").value.trim() || "Untitled",
        mode, kind, created: new Date().toISOString(),
      });
    });
    document.getElementById("open-existing").addEventListener("click", async () => {
      const file = await window.studio.readFileDialog();
      if (!file) return;
      const project = JSON.parse(file.contents);
      project._path = file.path;
      window.studio.openProject(project);
    });
  </script>
</body>
</html>

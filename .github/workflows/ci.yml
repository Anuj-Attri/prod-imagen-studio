name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Secret hygiene
        run: |
          if grep -RInE "(sk-[A-Za-z0-9]{20,}|rpa_[A-Za-z0-9]{20,}|(api|secret)_key[\"']?\s*[:=]\s*[\"'][A-Za-z0-9_-]{16,})" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude=package-lock.json .; then
            echo "Potential secret committed"
            exit 1
          fi

      - name: No local-only files committed
        run: |
          for f in server/keys.json CLAUDE.md AGENTS.md GEMINI.md NOTES.md; do
            if git ls-files --error-unmatch "$f" > /dev/null 2>&1; then
              echo "$f must not be tracked"
              exit 1
            fi
          done

      - name: Install renderer dependencies
        working-directory: studio
        run: npm ci

      # The same entry point a contributor runs, so the build cannot
      # drift away from what they are told to check.
      - name: Verify
        run: node verify.js

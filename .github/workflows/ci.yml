name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check main process and renderer
        run: |
          node --check studio/main.js
          node --check studio/preload.js
          node --check studio/editor.js

      - name: Compile server
        run: python -m py_compile server/gen_server.py

      - name: Secret hygiene
        run: |
          if grep -RInE "(sk-[A-Za-z0-9]{20,}|rpa_[A-Za-z0-9]{20,}|(api|secret)_key[\"']?\s*[:=]\s*[\"'][A-Za-z0-9_-]{16,})" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude=package-lock.json .; then
            echo "Potential secret committed"
            exit 1
          fi

      - name: No local-only files committed
        run: |
          for f in server/keys.json CLAUDE.md AGENTS.md GEMINI.md NOTES.md; do
            if git ls-files --error-unmatch "$f" > /dev/null 2>&1; then
              echo "$f must not be tracked"
              exit 1
            fi
          done

      - name: Install renderer dependencies
        working-directory: studio
        run: npm ci

      - name: Renderer self-test
        run: node studio/selftest.js

      # Neither an image engine nor a language backend exists here, so the
      # probe checks the half that does not need them: a bad request must
      # be answered plainly rather than with an internal error.
      - name: Server rejects bad input cleanly
        run: |
          python -m server.gen_server &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8787/health > /dev/null && break
            sleep 1
          done
          python server/probe.py

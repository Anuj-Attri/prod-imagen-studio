name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check main process and renderer
        run: |
          node --check studio/main.js
          node --check studio/preload.js
          node --check studio/editor.js

      - name: Compile server
        run: python -m py_compile server/gen_server.py

      - name: Secret hygiene
        run: |
          if grep -RInE "(sk-[A-Za-z0-9]{20,}|rpa_[A-Za-z0-9]{20,}|(api|secret)_key[\"']?\s*[:=]\s*[\"'][A-Za-z0-9_-]{16,})" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude=package-lock.json .; then
            echo "Potential secret committed"
            exit 1
          fi

      - name: No local-only files committed
        run: |
          for f in server/keys.json CLAUDE.md AGENTS.md GEMINI.md NOTES.md; do
            if git ls-files --error-unmatch "$f" > /dev/null 2>&1; then
              echo "$f must not be tracked"
              exit 1
            fi
          done

      - name: Renderer loads without console errors
        run: |
          cd studio && npm ci
          node - <<'NODE'
          const fs = require("fs");
          const html = fs.readFileSync("editor.html", "utf-8");
          for (const id of ["canvas-wrap", "canvas-overlay", "dock", "menubar", "tools"]) {
            if (!html.includes(`id="${id}"`)) {
              console.error(`editor.html is missing #${id}`);
              process.exit(1);
            }
          }
          // Konva clears its container, so overlay UI must be a sibling
          const wrap = html.indexOf('id="canvas-wrap"');
          const overlay = html.indexOf('id="canvas-overlay"');
          if (html.slice(wrap, overlay).includes("<div id=\"canvas-overlay\"") === false
              && overlay < wrap) {
            console.error("canvas-overlay must follow canvas-wrap as a sibling");
            process.exit(1);
          }
          console.log("structure checks passed");
          NODE

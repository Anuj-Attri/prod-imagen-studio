name: Release installers

# Two stages on purpose. The builds run in parallel and publish nothing;
# one job afterwards makes the release and attaches everything.
#
# Building and releasing in the same matrix job means every platform races
# to create the same release. That produced two drafts under one tag, the
# Windows installer on one and the macOS ones on the other, with both jobs
# reporting success: nothing failed, the release was simply half of itself
# in two places. It also breaks self-updating, because the updater reads
# latest.yml from the release and there were two of them.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./studio/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match studio/package.json version $pkg"
            exit 1
          fi

      - name: Point the updater at this repository
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = "studio/package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf-8"));
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
          pkg.build.publish = [{ provider: "github", owner, repo }];
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          console.log(`updater points at ${owner}/${repo}`);
          NODE

      - name: Install dependencies
        working-directory: studio
        run: npm ci

      - name: Build installer
        working-directory: studio
        run: npm run dist
        env:
          # unsigned builds: signing requires certificates the repo does not hold
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # An installer that was never produced must not pass quietly. The
      # upload of an empty match counts as success, so a platform that
      # silently built nothing would reach the release as an absence.
      - name: Check something installable came out
        shell: bash
        working-directory: studio
        run: |
          ls -1 dist/ || true
          # Counted with a glob rather than by asking ls, because a glob
          # that matches nothing makes ls exit non-zero, and under
          # pipefail that failure ends the step. The first version of this
          # check used ls and so failed on every platform: on macOS for the
          # absent .exe, on Windows for the absent .dmg, while the
          # installers it was looking for sat in the listing above it.
          shopt -s nullglob
          built=(dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb)
          echo "installable artifacts: ${#built[@]}"
          if [ ${#built[@]} -eq 0 ]; then
            echo "::error::${{ matrix.os }} produced no installer"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            studio/dist/*.exe
            studio/dist/*.dmg
            studio/dist/*.zip
            studio/dist/*.AppImage
            studio/dist/*.deb
            studio/dist/*.blockmap
            studio/dist/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Show what will be attached
        run: ls -lh installers/

      # Every file the update feed names must be a file that exists, under
      # exactly that name.
      #
      # It did not. An artifact name containing spaces is written into
      # latest.yml with hyphens and uploaded to GitHub with dots, so the
      # updater asked for Firestarter-Setup-0.6.1.exe while the release held
      # Firestarter.Setup.0.6.1.exe. The version was found, the download
      # 404'd, and it looked exactly like there being no update. Two
      # published releases shipped that way.
      #
      # Checked here rather than trusted, because nothing else in the chain
      # compares the two: the build succeeds, the upload succeeds, the
      # release looks complete, and only an installed copy ever finds out.
      - name: The update feed must name files that exist
        run: |
          cd installers
          missing=0
          for feed in latest*.yml; do
            [ -f "$feed" ] || continue
            echo "checking $feed"
            # every "url:" and "path:" value in the feed
            named=$(grep -Eo '^\s*(-\s*)?(url|path):\s*\S+' "$feed" \
                    | sed -E 's/.*:\s*//' | sort -u)
            for file in $named; do
              if [ -f "$file" ]; then
                echo "  ok      $file"
              else
                echo "  MISSING $file"
                missing=$((missing + 1))
              fi
            done
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing file(s) named by an update feed were not built."
            echo "An artifactName containing spaces causes exactly this."
            ls -1
            exit 1
          fi

      # One job, one release. The .yml and .blockmap files are what
      # electron-updater reads to find a new version, so they have to sit
      # on the same release as the installers they describe.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: installers/*

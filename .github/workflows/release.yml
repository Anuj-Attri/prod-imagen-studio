name: Release installers

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the tag matches package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./studio/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match studio/package.json version $pkg"
            exit 1
          fi

      - name: Point the updater at this repository
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = "studio/package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf-8"));
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
          pkg.build.publish = [{ provider: "github", owner, repo }];
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          console.log(`updater points at ${owner}/${repo}`);
          NODE

      - name: Install dependencies
        working-directory: studio
        run: npm ci

      - name: Build installer
        working-directory: studio
        run: npm run dist
        env:
          # unsigned builds: signing requires certificates the repo does not hold
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # The .yml and .blockmap files are what electron-updater reads to
      # discover a new version. Without them the app never self-updates.
      - name: Attach to draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            studio/dist/*.exe
            studio/dist/*.dmg
            studio/dist/*.zip
            studio/dist/*.blockmap
            studio/dist/latest*.yml
